    <a id="sa-12.3-085"/>
    <h4>12.3 085 glibc (LFS)              Date: 2025-08-05  Severity: Medium</h4>
    <p>In glibc-2.42, a security vulnerability was fixed that can allow for
    a double free when using the regcomp() function. The double free can be
    accomplished by a malloc failure or by using an interposed malloc that
    injects random malloc failures, and the double free is known to cause
    buffer manipulation depending on how the regex passed to regcomp is
    constructed. All versions from glibc-2.4 to 2.41 are known to be affected.
    This can cause arbitrary code execution or a denial of service.</p>
